name: Build lossless flood overlay WebP

on:
  push:
    branches: [main]
    paths:
      - tools/build_all_overlay_webp.py
      - .github/workflows/convert-overlay-webp.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: north-wildwood-overlay-assets
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python tools/build_all_overlay_webp.py
      - name: Commit WebP overlays
        id: generated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets
          if ! git diff --cached --quiet; then
            git commit -m 'Add lossless WebP flood overlays'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch exact-commit application checks
        if: steps.generated.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_SHA: ${{ steps.generated.outputs.sha }}
        run: python3 tools/release_dispatch.py --candidate "$GENERATED_SHA"
