name: Refresh North Wildwood observed data daily

on:
  schedule:
    # Keep municipal and Stone Harbor archives on their daily UTC schedule.
    - cron: "40 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Serialize against the forecast pipeline while leaving child locks independent.
concurrency:
  group: north-wildwood-generated-refresh
  queue: max
  cancel-in-progress: false

jobs:
  archive-city-gauge:
    uses: ./.github/workflows/update-city-gauge-archive.yml
    secrets: inherit

  update-observed:
    needs: archive-city-gauge
    # A failed municipal refresh leaves the last committed archive available.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-observed.yml
    secrets: inherit

  publish-fresh-data:
    needs: update-observed
    uses: ./.github/workflows/refresh-deployed-data.yml
    secrets: inherit
