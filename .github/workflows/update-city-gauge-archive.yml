name: Update North Wildwood city gauge archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-city-gauge-archive.yml
      - tools/archive_north_wildwood_city_gauge.mjs

permissions:
  contents: write

concurrency:
  group: north-wildwood-city-gauge-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve every municipal tide record
        run: node tools/archive_north_wildwood_city_gauge.mjs
      - name: Commit the refreshed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city-gauge/data
          if git diff --cached --quiet; then
            echo "Archive is already current."
            exit 0
          fi
          git commit -m "Update North Wildwood city gauge archive"
          git pull --rebase origin main
          git push origin HEAD:main
