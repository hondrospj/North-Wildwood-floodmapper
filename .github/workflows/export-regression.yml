name: Export regression
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  pull_request:
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            assets/export-area.js
            assets/export-preview.js
            assets/export-road-labels.js
            assets/roads/north-wildwood-road-centerlines.geojson
            assets/north-wildwood-font.css
            assets/north-wildwood-loading.js
            assets/north-wildwood-loading.css
            assets/modal-focus.js
            assets/3d/north-wildwood-3d.js
            assets/app/
            assets/styles/
            tools/app/
            tools/app_source.*
            tools/build_north_wildwood_app.mjs
            tools/test_north_wildwood_refactor_parity.mjs
            tools/fixtures/north-wildwood-refactor-baseline.json
            tools/fixtures/north-wildwood-export-preview-ui.json
            tools/fixtures/north-wildwood-export-presentation.json
            tools/fixtures/north-wildwood-boundary-startup.json
            tools/fixtures/north-wildwood-pane-startup.json
            tools/fixtures/north-wildwood-ui-startup.json
            tools/fixtures/north-wildwood-view-pill-surface.json
            tools/fixtures/north-wildwood-loader-restore.json
            tools/fixtures/north-wildwood-20261026-bug-fixes.json
            tools/fixtures/north-wildwood-20261026-holistic-fixes.json
            tools/fixtures/north-wildwood-20261027-line-fixes.json
            tools/fixtures/north-wildwood-20261028-export-road-labels.json
            tools/fixtures/north-wildwood-export-dst.json
            Boundaries/North Wildwood.geojson
            tools/test_export*.mjs
            tools/test_north_wildwood_export_layout.mjs
            tools/test_north_wildwood_export_road_labels.mjs
            tools/test_north_wildwood_export_dates.mjs
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify map export
        run: |
          node tools/build_north_wildwood_app.mjs --check
          node tools/test_north_wildwood_refactor_parity.mjs --self-test
          node --check assets/export-area.js
          node --check assets/export-preview.js
          node --check assets/export-road-labels.js
          node tools/test_export_preview.mjs
          node tools/test_export_holistic.mjs
          node tools/test_export_availability_performance.mjs
          node tools/test_export_review.mjs
          node tools/test_export_footer.mjs
          node tools/test_north_wildwood_export_dates.mjs
          node tools/test_north_wildwood_export_layout.mjs
          node tools/test_north_wildwood_export_road_labels.mjs
          node tools/test_export_syntax.mjs
          node tools/test_export_recovery.mjs
          node tools/test_export_streaming.mjs
          node tools/test_export_history.mjs
          node tools/test_export_frame_recovery.mjs
          node tools/test_export_worker_cancellation.mjs
