name: Update North Wildwood forecast

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-forecast.yml
      - tools/north_wildwood_tide_anchors.py
      - tools/update_north_wildwood_forecast.py
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: north-wildwood-data-updates-v2
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build forecast.json from PETSS station CSV guidance
        shell: bash
        run: |
          python3 tools/update_north_wildwood_forecast.py

      - name: Generate non-operational PETSS research comparison
        run: python tools/experimental_petss_guidance.py --input forecast.json --output data/experimental_petss_guidance.json

      - name: Select issued PETSS ensemble mean for operational forecasts
        run: python3 tools/select_petss_mean.py forecast.json

      - name: Commit updated forecast
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.json data/experimental_petss_guidance.json
          git diff --staged --quiet || git commit -m "Update North Wildwood forecast"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 pull/rebase retries." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
