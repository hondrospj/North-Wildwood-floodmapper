name: Publish North Wildwood Flood Mapper to GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/publish-github-pages.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: hondrospj/North-Wildwood-floodmapper/.github/workflows/publish-pages-data.yml@main
    with:
      # Publish this tested UI together with the current validated forecast.
      ui_sha: 5c9c405e4a6bb1f39342ccbd1460137f4ee25cba
