name: Stage reviewed FloodMapper repair
on:
  push:
    branches: [codex/audit-deployment-20260912]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .publish_stage
            tools
            docs
            city-gauge
            observed_archive
            assets/3d
      - name: Materialize and verify reviewed Git blobs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,subprocess
          root=Path('.publish_stage')
          manifest=json.loads((root/'manifest.json').read_text())
          raw=base64.b64decode(''.join(p.read_text() for p in sorted(root.glob('part*.txt'))))
          assert hashlib.sha256(raw).hexdigest()==manifest['bundleSha256']
          bundle=Path(os.environ['RUNNER_TEMP'])/'reviewed.bundle'
          bundle.write_bytes(raw)
          subprocess.run(['git','bundle','verify',str(bundle)],check=True)
          subprocess.run(['git','fetch',str(bundle),'codex/floodmapper-audit-fixes'],check=True)
          paths=[]
          for row in manifest['files']:
              path=Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and not str(path).startswith('.github/')
              data=subprocess.check_output(['git','cat-file','blob',row['sha']])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              paths.append(str(path))
          subprocess.run(['git','add','--sparse','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize verified repair assets for publication'
          git push origin HEAD:codex/audit-deployment-20260912
      - name: Backfill original sources and rebuild qualified observations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          path=Path('index.html')
          text=path.read_text()
          assert text.count('20260826-nw-3d-v62')==1
          path.write_text(text.replace('20260826-nw-3d-v62','20260912-audit-repair'))
          for row in json.loads(Path('.publish_stage/phase-two.json').read_text()):
              data=Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha'],row['path']
          PY
          python3 tools/update_observed_15min.py --full --output stone_harbor_observed15min.json --no-update-hourly
          node tools/archive_north_wildwood_city_gauge.mjs
          node tools/build_north_wildwood_stone_harbor_comparison.mjs
          python3 tools/merge_north_wildwood_city_gauge.py
          python3 tools/validate_observed_contract.py
          python3 tools/build_observed_archive_shards.py
          python3 tools/test_north_wildwood_city_gauge_merge.py
          python3 tools/test_observed_archive_shards.py
          python3 - <<'PY'
          import json
          from collections import Counter
          archive=json.load(open('observed15min.json'))
          counts=Counter(''.join(day['q'] for day in archive['days']))
          assert counts['U']==0, counts
          print('Backfilled sampling flags:',dict(counts))
          PY
          git add --sparse -- index.html stone_harbor_observed15min.json observed.json observed15min.json observed_archive_index.json observed_archive/stone-harbor city-gauge/data city-gauge/comparison
          git diff --cached --check
          git commit -m 'Backfill original gauge sampling provenance after calibration review'
          git push origin HEAD:codex/audit-deployment-20260912
