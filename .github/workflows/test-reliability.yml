name: FloodMapper reliability checks
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  pull_request:
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scientific test dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev python3-gdal python3-numpy python3-scipy python3-pil python3-rasterio clang
      - name: Browser logic and committed asset contracts
        run: |
          node tools/build_north_wildwood_app.mjs --check
          node tools/test_north_wildwood_refactor_parity.mjs --self-test
          python3 tools/test_release_gate.py
          python3 tools/test_release_data.py
          node tools/check_inline_scripts.mjs
          node tools/test_interaction_races.mjs
          node tools/test_north_wildwood_3d_interactions.mjs
          node tools/test_north_wildwood_address_recovery.mjs
          node tools/test_north_wildwood_export_dates.mjs
          node tools/test_north_wildwood_top_tides_and_live_observations.mjs
          node tools/test_north_wildwood_renderer_regressions.mjs index.html
          node tools/test_north_wildwood_legend_keyboard.mjs index.html
          node tools/test_north_wildwood_ui_state.mjs index.html
          node tools/test_north_wildwood_camera_geometry.mjs index.html
          node tools/test_north_wildwood_popup_focus.mjs assets/3d/north-wildwood-3d.js
          node tools/test_north_wildwood_timeline_day_bounds.mjs
          node tools/test_north_wildwood_slider_controls.mjs
          node tools/test_north_wildwood_ui_ownership.mjs
          node tools/test_north_wildwood_loading.mjs
          node tools/test_north_wildwood_forecast_source.mjs
          python3 tools/test_north_wildwood_forecast_generation.py
          python3 tools/test_north_wildwood_tide_anchors.py
          node tools/test_north_wildwood_raster_lifetime.mjs
          node tools/test_north_wildwood_startup_performance.mjs
          node tools/test_north_wildwood_boundary_startup.mjs
          node tools/test_north_wildwood_browser_contract.mjs
          node tools/test_north_wildwood_reliability.mjs
          node tools/test_north_wildwood_frame_swap.mjs
          node tools/test_north_wildwood_3d_recovery.mjs
          node tools/test_north_wildwood_road_impacts.mjs
          node tools/test_north_wildwood_filling_transition.mjs
          node tools/test_north_wildwood_export_layout.mjs
          node tools/test_north_wildwood_archive_contract.mjs
          node tools/test_north_wildwood_hourly_replay.mjs
      - name: Observation, projection, and model contracts
        run: |
          /usr/bin/python3 tools/validate_observed_contract.py
          /usr/bin/python3 tools/test_observation_quality.py
          /usr/bin/python3 tools/test_north_wildwood_city_gauge_merge.py
          /usr/bin/python3 tools/test_update_observed_15min.py
          /usr/bin/python3 tools/test_observed_archive_shards.py
          /usr/bin/python3 tools/test_flood_history_projection_model.py
          /usr/bin/python3 tools/test_return_intervals.py
          /usr/bin/python3 tools/test_north_wildwood_bathtub.py
          /usr/bin/python3 tools/test_hydraulic_mask_sequence.py
          /usr/bin/python3 tools/test_hydraulic_graph_contract.py
          /usr/bin/python3 model/tests/test_model_contract.py
          /usr/bin/python3 model/tests/test_cache_and_arrival.py
      - name: Browser layout regression
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/test_north_wildwood_layout.mjs
  full-app-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NWW_BROWSER: ${{ matrix.browser }}
      NWW_TEST_URL: http://127.0.0.1:8765/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real application, responsive and rapid-interaction regressions
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/floodmapper-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/test_north_wildwood_loading_browser.mjs
          node tools/test_north_wildwood_pane_startup.mjs
          node tools/test_north_wildwood_ui_startup.mjs
          node tools/test_north_wildwood_view_pill.mjs
          if [ "$NWW_BROWSER" = "chromium" ]; then node tools/test_north_wildwood_webcams.mjs; fi
          node tools/test_north_wildwood_export_interactions.mjs
          node tools/test_north_wildwood_20261026_browser.mjs
          node tools/test_north_wildwood_mobile_interactions.mjs
          NWW_TOUCH=1 node tools/test_north_wildwood_mobile_interactions.mjs
          node tools/test_north_wildwood_audit_regressions.mjs
          node tools/test_north_wildwood_responsive.mjs
