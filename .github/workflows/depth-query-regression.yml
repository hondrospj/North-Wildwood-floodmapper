name: Depth query regression
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  pull_request:
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /tools/test_depth_query.mjs
            /tools/app_source.*
            /tools/app/
            /assets/app/
            /assets/styles/
            /assets/**/*Query*.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_depth_query.mjs --assets
