name: Update North Wildwood observed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-observed.yml
      - tools/update_observed_15min.py
      - tools/update_historic_crests.py
      - tools/build_observed_archive_shards.py
  schedule:
    - cron: "37 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: north-wildwood-data-updates-v2
  cancel-in-progress: false

jobs:
  update-observed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update 15-minute and hourly archives
        run: python3 tools/update_observed_15min.py --update-hourly

      - name: Update official USGS historic crests
        run: python3 tools/update_historic_crests.py

      - name: Rebuild browser-optimized archive indexes and year shards
        run: python3 tools/build_observed_archive_shards.py

      - name: Commit archive updates
        shell: bash
        run: |
          if git diff --quiet -- observed.json observed15min.json toptides.json observed_archive_index.json lewes_archive_index.json observed_archive; then
            echo "Observed archives and historic crests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observed.json observed15min.json toptides.json observed_archive_index.json lewes_archive_index.json observed_archive
          git commit -m "Update North Wildwood observed archives"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 pull/rebase retries." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
