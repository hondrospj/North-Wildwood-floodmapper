name: Holistic device regression
run-name: Windows cold query diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-query-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NWW_TEST_URL: http://127.0.0.1:8771/index.html
      NWW_CHROMIUM_CHANNEL: chromium
      NWW_DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome runtime
        shell: pwsh
        run: |
          python --version
          npm install --no-save --ignore-scripts playwright
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
      - name: Probe actual cold getters and cold draining export
        shell: pwsh
        run: |
          $diagnosticServer = Start-Process python -ArgumentList '-m','http.server','8771','--bind','127.0.0.1' -RedirectStandardOutput preview-output.log -RedirectStandardError preview-error.log -PassThru
          try {
            $diagnosticReady = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { Invoke-WebRequest http://127.0.0.1:8771/index.html -UseBasicParsing | Out-Null; $diagnosticReady = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $diagnosticReady) { throw 'Diagnostic server did not start' }
            node tools/diagnose_north_wildwood_query_transport.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Cold query diagnostic recorded a failure; inspect artifacts' }
          } finally {
            Stop-Process -Id $diagnosticServer.Id -ErrorAction SilentlyContinue
          }
      - name: Save passive diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cold-query-diagnostic
          path: |
            query-diagnostic/
            preview-*.log
