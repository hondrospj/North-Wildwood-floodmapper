name: Holistic device regression
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  pull_request:
    paths-ignore:
      - forecast.json
      - data/experimental_petss_guidance.json
      - observed.json
      - observed15min.json
      - stone_harbor_observed15min.json
      - toptides.json
      - observed_archive_index.json
      - lewes_archive_index.json
      - lewes_hourly.json
      - observed_archive/**/*.json
      - city-gauge/data/**/*.json
      - city-gauge/comparison/**/*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, edge, firefox]
    env:
      NWW_BROWSER: ${{ matrix.browser }}
      AUDIT_BROWSER: ${{ matrix.browser }}
      AUDIT_OUTPUT: audit-results/${{ matrix.browser }}/matrix
      NWW_AUDIT_OUTPUT: audit-results/${{ matrix.browser }}/ui
      NWW_TEST_URL: http://127.0.0.1:8771/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts playwright
          if ('${{ matrix.browser }}' -eq 'edge') { npx playwright install msedge }
          else { npx playwright install ${{ matrix.browser }} }
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
      - name: Test actual Windows browsers with desktop and touch-size profiles
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8771','--bind','127.0.0.1' -RedirectStandardOutput preview-output.log -RedirectStandardError preview-error.log -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { Invoke-WebRequest http://127.0.0.1:8771/index.html -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Preview did not start; no application scenarios were run.' }
            node tools/test_north_wildwood_holistic_ui.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Holistic UI regressions failed' }
            node tools/test_north_wildwood_device_matrix.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Device matrix regressions failed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Save reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holistic-windows-${{ matrix.browser }}
          path: |
            audit-results/
            preview-*.log
